# Guardian integration tests; no starter Guardian or injector.
services:
  diagnostics-campaign:
    build:
      context: .
      dockerfile: diagnostics/Dockerfile.tests
    image: local/ota-guardian-diagnostics-tests:dev
    tmpfs: [/tmp]
    ipc: "service:opensovd-dfm"
    entrypoint: ["/bin/sh", "/diagnostics-entrypoint.sh", "/usr/local/bin/diagnostics-campaign"]
    command: ["--ignored", "--nocapture"]
    environment:
      FAULT_CATALOG: /catalog/battery_guardian.json
      SOVD_ENTITY: battery_guardian
      SOVD_URL: http://opensovd-gateway:7690/sovd/v1
      EVIDENCE_DIR: /evidence
      SCENARIO: ${SCENARIO:-freshness}
      RUST_LOG: warn
    volumes:
      - ./diagnostics/catalog:/catalog:ro
      - ${EVIDENCE_DIR:?Set EVIDENCE_DIR}:/evidence
    depends_on:
      opensovd-gateway:
        condition: service_healthy
