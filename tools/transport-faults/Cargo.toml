# Standalone experiment: which transport faults can be injected on the
# uProtocol/Zenoh link, and what does the receiver see?
[workspace]

[package]
name = "transport-faults"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["full"] }
async-trait        = "0.1"
up-rust            = "0.9"
up-transport-zenoh = "0.9"
zenoh              = { version = "1", features = ["unstable"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
prost              = "0.12"
thermal-contract   = { path = "../../contracts" }
