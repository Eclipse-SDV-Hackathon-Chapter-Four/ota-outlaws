# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5)

[package]
name = "campaign"
version = "0.1.0"
description = "Fault campaigns for the Battery Thermal Guardian: injection, evidence, verdicts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
guardian = { path = "../guardian" }
humantime = "2.4.0"
prost = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thermal-contract = { path = "../contracts", features = ["transport"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal", "sync", "io-util"] }
toml = "1.1.6"
up-rust = "0.9"
