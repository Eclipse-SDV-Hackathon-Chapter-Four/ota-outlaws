[[scenario.expect]]
kind = "fault"
dtc = "BTG_TempFreshnessLost"
budget = "T_stale + T_react"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "degraded"
dtc = "BTG_TempFreshnessLost"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "sovd"
dtc = "BTG_TempFreshnessLost"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario.expect]]
kind = "recovery"
dtc = "BTG_TempFreshnessLost"
requirement = "FSR-2.6"

[[scenario]]
