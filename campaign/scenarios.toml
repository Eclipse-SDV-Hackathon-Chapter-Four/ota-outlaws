dtc = "BTG_TempCounterStuck"
budget = "T_counter_stuck + T_react"
requirement = "FSR-2.3"

[[scenario.expect]]
kind = "degraded"
dtc = "BTG_TempCounterStuck"
requirement = "FSR-2.3"

[[scenario.expect]]
kind = "sovd"
dtc = "BTG_TempCounterStuck"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario.expect]]
