[[scenario]]
id = "temp_stuck"
description = "Maximum, average, and minimum all fixed at 39 degC for 2 s"
fault_class = "Signal"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-09"]
status = "implemented"
note = "Known limitation: all temperatures frozen together look like a battery at constant temperature, so FSR-2.4 does not apply and no fault is expected. max_stuck tests FSR-2.4."
stimulus = { type = "can_trace", trace = "campaign/traces/temp_stuck.asc" }
onset = "none"

[[scenario.expect]]
kind = "no_fault"
requirement = "FSR-2.4"

# --- HARA test scenarios for loss of data at startup, at the source, and in transport

[[scenario]]
id = "startup_without_source"
description = "The Guardian starts, but no temperature source runs"
fault_class = "Source"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-03"]
status = "implemented"
stimulus = { type = "no_source", duration_ms = 4000 }
onset = "no_input"

[[scenario.expect]]
kind = "startup_fault"
dtc = "BTG_TempNoDataAtStartup"
budget = "T_stale + T_react"
requirement = "FSR-2.1"

[[scenario.expect]]
kind = "degraded"
dtc = "BTG_TempNoDataAtStartup"
requirement = "FSR-2.1"

[[scenario.expect]]
kind = "sovd"
dtc = "BTG_TempNoDataAtStartup"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario]]
id = "source_shutdown"
description = "The CAN source shuts down after 6 s of valid data and stays down"
fault_class = "Source"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-04"]
status = "implemented"
stimulus = { type = "can_trace", trace = "campaign/traces/nominal.asc", stop = ["kuksa-can-provider"], stop_after_ms = 6000 }
onset = "stream_end"

[[scenario.expect]]
kind = "fault"
dtc = "BTG_TempFreshnessLost"
budget = "T_stale + T_react"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "degraded"
dtc = "BTG_TempFreshnessLost"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "sovd"
dtc = "BTG_TempFreshnessLost"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario]]
id = "transport_dropout"
description = "The Guardian is cut off the network for 2 s while source and publisher keep sending"
fault_class = "Transport"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-06"]
status = "implemented"
note = "The dropout lies behind the tap, so the tap cannot observe it; t0 is the tool's injection time. The tap still receiving samples places the loss between the publisher and the Guardian."
stimulus = { type = "can_trace", trace = "campaign/traces/nominal.asc", isolate = "guardian", isolate_after_ms = 6000, isolate_for_ms = 2000 }
onset = "injection:isolate"

[[scenario.expect]]
kind = "fault"
dtc = "BTG_TempFreshnessLost"
budget = "T_stale + T_react"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "degraded"
dtc = "BTG_TempFreshnessLost"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "samples_continue"
requirement = "EC-1"

[[scenario.expect]]
kind = "sovd"
dtc = "BTG_TempFreshnessLost"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario.expect]]
kind = "recovery"
dtc = "BTG_TempFreshnessLost"
requirement = "FSR-2.6"

[[scenario]]
id = "invalid_during_warning"
description = "In WARNING, 1 s of low readings marked INVALID, then valid WARNING-level data"
fault_class = "Signal"
hazard = "HE-1"
safety_goal = "SG-4"
hara_tests = ["TS-10"]
status = "implemented"
stimulus = { type = "can_trace", trace = "campaign/traces/invalid_during_warning.asc" }
