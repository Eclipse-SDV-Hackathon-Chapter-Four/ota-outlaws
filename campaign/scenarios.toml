# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5)

# Scenario catalog: one test case per scenario, with its stimulus, the fault
# onset the campaign tool looks for at the Guardian's input, and the expected
# reactions. Hazardous events (HE) and safety goals (SG) refer to the HARA,
# docs/reference/hara.md; requirements to docs/explanation/safety-concept.md.
#
# status = "implemented": every requirement checked here is implemented, so a
#          failure is a defect.
# status = "planned":     the scenario checks a planned requirement. It runs
#          and is reported, and fails until the requirement is implemented.

# Budget parameters in milliseconds that are not in
# config/guardian/safety-params.toml. T_stale, T_stuck, and T_recover come
# from there; T_counter_stuck is N_stuck repeated frames times the cycle.
[budgets]
cycle = 100
T_react = 100  # HARA DFR-1
T_diag = 2000

# --- Nominal ------------------------------------------------------------------

[[scenario]]
id = "normal"
description = "Nominal data, 40 degC, incrementing alive counter"
fault_class = "None"
hara_tests = ["TS-01"]
status = "implemented"
stimulus = { type = "can_trace", trace = "campaign/traces/normal.asc" }
onset = "none"

# The Guardian starts while the source is already running, so this budget
# includes its start. TS-01 sets no time limit.
[[scenario.expect]]
kind = "thermal"
state = "MONITORING"
budget = "5000"
requirement = "baseline"

[[scenario.expect]]
kind = "not_thermal"
state = "WARNING"
requirement = "baseline"

[[scenario.expect]]
kind = "no_fault"
requirement = "SG-4"

[[scenario]]
id = "heating"
description = "Heating through 45 degC and 55 degC, hold, cool down"
fault_class = "Thermal"
hazard = "HE-1"
safety_goal = "SG-1"
hara_tests = ["TS-02", "TS-12"]
status = "implemented"
stimulus = { type = "can_trace", trace = "campaign/traces/heating.asc" }
onset = "max_at_least:45"

[[scenario.expect]]
kind = "thermal"
state = "WARNING"
budget = "T_react"
requirement = "FSR-1.1"

[[scenario.expect]]
kind = "thermal"
state = "CRITICAL"
budget = "T_react"
after = "max_at_least:55"
requirement = "FSR-1.2"

[[scenario.expect]]
kind = "driver_warning_overtemp"
budget = "T_react"
after = "max_at_least:55"
requirement = "FSR-1.2"

[[scenario.expect]]
kind = "overtemp_dtc"
dtc = "BTG_TempOverTempWarning"
state = "WARNING"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario.expect]]
kind = "overtemp_dtc"
dtc = "BTG_TempOverTempCritical"
state = "CRITICAL"
budget = "T_diag"
requirement = "FSR-D.2"

[[scenario.expect]]
kind = "no_fault"
requirement = "SG-4"

# --- Transport and source: loss of fresh data -----------------------------------

[[scenario]]
