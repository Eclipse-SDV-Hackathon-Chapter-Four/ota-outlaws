description = "Maximum frozen at 42 degC for 5 s while average and minimum rise"
fault_class = "Signal"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-08"]
status = "implemented"
stimulus = { type = "can_trace", trace = "campaign/traces/max_stuck.asc" }
onset = "max_frozen_while_reference_moves"

[[scenario.expect]]
kind = "fault"
dtc = "BTG_TempSignalStuck"
