# --- Planned requirements: expected to fail until implemented ---------------------

[[scenario]]
id = "counter_error"
description = "AliveCounter skips from 39 to 45, then resumes"
fault_class = "Transport"
hazard = "HE-1"
safety_goal = "SG-2"
status = "planned"
stimulus = { type = "can_trace", trace = "campaign/traces/counter_error.asc" }
onset = "alive_counter_jumps"

[[scenario.expect]]
kind = "fault"
dtc = "BTG_TempCounterError"
budget = "T_react"
requirement = "FSR-3.7"

[[scenario]]
id = "high_delta"
description = "CellTempMax 100 degC and CellTempMin 10 degC, a 90 degC spread"
fault_class = "Signal"
hazard = "HE-1"
safety_goal = "SG-1"
status = "planned"
note = "100 degC appears within 100 ms, so FSR-3.3 rejects it as a spike and raises WARNING. A hot spot that builds up plausibly (FSR-1.4) is not tested by this trace."
stimulus = { type = "can_trace", trace = "campaign/traces/high_delta.asc" }
onset = "max_at_least:100"

[[scenario.expect]]
kind = "thermal"
state = "WARNING"
budget = "T_react"
requirement = "FSR-1.4"

