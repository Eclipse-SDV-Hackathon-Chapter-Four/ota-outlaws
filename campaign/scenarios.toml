status = "implemented"
note = "The watchdog must report the lost heartbeat. Restart is the runtime's job and not checked; no occupant warning exists."
stimulus = { type = "can_trace", trace = "campaign/traces/nominal.asc", watchdog = true, stop = ["guardian"], stop_after_ms = 6000 }
onset = "injection:stop"

[[scenario.expect]]
kind = "sovd_fault"
dtc = "BTG_GuardianHeartbeatLoss"
budget = "T_hb + T_diag"
requirement = "F-10"

[[scenario]]
id = "guardian_hang"
description = "The Guardian is frozen for 4 s while its process stays alive"
fault_class = "Guardian"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-23"]
status = "implemented"
note = "Pause stops the evaluation loop and the heartbeat; the watchdog reports the loss and the recovery after the unpause."
stimulus = { type = "can_trace", trace = "campaign/traces/nominal.asc", watchdog = true, pause = ["guardian"], pause_after_ms = 6000, pause_for_ms = 4000 }
onset = "injection:pause"

[[scenario.expect]]
kind = "sovd_fault"
dtc = "BTG_GuardianHeartbeatLoss"
budget = "T_hb + T_diag"
requirement = "F-10"

[[scenario.expect]]
kind = "sovd_recovery"
dtc = "BTG_GuardianHeartbeatLoss"
requirement = "F-10"

# TS-17 (out-of-range low value) has no scenario: the plausibility minimum is 0 degC and the CAN
# signals are unsigned (UINT16, offset 0), so a value below it cannot be sent.

# --- Further HARA tests (HARA TS-07, TS-08, TS-16, TS-24, TS-26) ---

[[scenario]]
id = "duplicate_message"
description = "One frame is delivered twice with the same AliveCounter, then fresh frames"
fault_class = "Transport"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-07"]
status = "implemented"
note = "One duplicate (two messages with the same counter) sets SUSPECT but must not cause a fault or a freshness timeout. Ten messages with the same counter (DEGRADED) are covered by counter_stuck."
stimulus = { type = "can_trace", trace = "campaign/traces/duplicate_message.asc" }
onset = "alive_counter_repeats"

[[scenario.expect]]
kind = "no_fault"
requirement = "FSR-2.2"

[[scenario.expect]]
kind = "samples_continue"
requirement = "EC-1"

[[scenario]]
id = "out_of_order"
description = "A previously published sample is delivered after a newer one"
fault_class = "Transport"
hazard = "HE-1"
safety_goal = "SG-2"
hara_tests = ["TS-08"]
status = "planned"
note = "The CAN trace cannot reorder publisher messages; needs a transport fault injector (fault_send on branch feature/transport-fault-injection) that reorders messages while the campaign observes. The SUSPECT state and the sequence-regression report of the Evidence Collector are not yet checked."
stimulus = { type = "external" }
onset = "none"

[[scenario.expect]]
kind = "not_lowered"
requirement = "FSR-2.4"

[[scenario.expect]]
kind = "samples_continue"
requirement = "EC-1"

