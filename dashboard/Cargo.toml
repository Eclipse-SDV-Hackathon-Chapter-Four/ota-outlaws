# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5)

[package]
name = "dashboard"
version = "0.1.0"
description = "Web dashboard: component status and control, input/output logs, OpenSOVD DTCs, campaign reports"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.6"
campaign = { path = "../campaign" }
futures-util = "0.3"
humantime = "2.4.0"
prost = "0.12"
prost-types = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thermal-contract = { path = "../contracts", features = ["transport"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal", "fs"] }
tonic = { version = "0.11", features = ["transport"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
up-rust = "0.9"

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-build = "0.11"
