name: Guardian

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "guardian/**"
      - "guardian-service/**"
      - "contracts/**"
      - "vss-publisher/**"
      - "config/guardian/**"
      - ".github/workflows/guardian.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test KUKSA Proxy
        # Built on its own, with its own lockfile.
        run: cargo test --locked --manifest-path vss-publisher/Cargo.toml
