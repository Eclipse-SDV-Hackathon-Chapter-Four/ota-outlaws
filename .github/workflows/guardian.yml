name: Guardian

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "components/guardian/**"
      - "components/guardian-service/**"
      - "third-party/fault-lib/**"
      - "components/contracts/**"
      - "components/campaign/**"
      - "components/vss-publisher/**"
      - "components/watchdog/**"
      - "config/guardian/**"
      - "config/can/**"
      - "deploy/diagnostics/**"
      - "deploy/docker-compose.yml"
      - "compose.yaml"
      - "docs/**"
      - ".github/workflows/guardian.yml"
      - ".github/workflows/diagnostics-image.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links and architecture claims
        run: python3 docs/check_architecture.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  diagnostic-image:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/diagnostics-image.yml
