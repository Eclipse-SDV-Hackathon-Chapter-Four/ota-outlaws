# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5); Codex / GPT-6.1 Sol (gpt-6.1-sol)

name: Guardian

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "guardian/**"
      - "guardian-service/**"
      - "third-party/fault-lib/**"
      - "contracts/**"
      - "campaign/**"
      - "vss-publisher/**"
      - "config/guardian/**"
      - "diagnostics/**"
      - "docker-compose.yml"
      - ".github/workflows/guardian.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Load the pinned diagnostic image
        run: |
          . diagnostics/image.env
          echo "DIAGNOSTICS_IMAGE=$DIAGNOSTICS_IMAGE" >> "$GITHUB_ENV"
          echo "PINNED_SOURCE_REV=$PINNED_SOURCE_REV" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published diagnostic stack
        run: |
          docker pull "$DIAGNOSTICS_IMAGE"
          revision=$(docker image inspect "$DIAGNOSTICS_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$PINNED_SOURCE_REV"
      - name: Test Guardian diagnostic campaigns
        run: python3 diagnostics/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-evidence
          path: diagnostics/reports/
