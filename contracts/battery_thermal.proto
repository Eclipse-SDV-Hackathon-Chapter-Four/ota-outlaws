// uProtocol payloads exchanged with the Battery Thermal Guardian.
// Topics and semantics are described in contracts/README.md.

syntax = "proto3";

package ota_outlaws.battery_thermal.v1;

// Published by the KUKSA Proxy: one message per CAN frame (assumption A-2).
message BatteryTemperature {
  // Maximum, average, and minimum cell temperature in °C.
  float max_c = 1;
  float avg_c = 2;
  float min_c = 3;
  // Time the values were captured at their origin, in milliseconds on the
  // source's clock (assumption A-1).
  uint64 source_timestamp_ms = 4;
  // Increases by one per published message (assumption A-1).
  uint64 sequence = 5;
  // Alive counter of the CAN frame, 0 to 255 (assumption A-3).
  uint32 alive_counter = 6;
  // Quality flag of the CAN frame (assumption A-3).
  Quality quality = 7;
}

// The numbers match the raw values of the CAN signal.
enum Quality {
  QUALITY_UNDEFINED = 0;
  QUALITY_OK = 1;
  QUALITY_INVALID = 2;
}

// Published by the Guardian for every state change, fault, and mitigation
// request.
message GuardianEvent {
  // Unique within one Guardian run, assigned in order, starting at 1.
  uint64 event_id = 1;
  // The event that caused this one; 0 if there is none.
  uint64 cause_event_id = 2;
  // Guardian's local monotonic time in milliseconds since it started. Only
  // comparable with other events of the same run.
  uint64 guardian_time_ms = 3;

  oneof kind {
    ThermalStateChanged thermal_state_changed = 10;
    MonitoringStatusChanged monitoring_status_changed = 11;
    FaultDetected fault_detected = 12;
    MitigationRequested mitigation_requested = 13;
  }
}

message ThermalStateChanged {
  ThermalState previous = 1;
  ThermalState current = 2;
  // The sample that caused the change.
  SampleRef trigger = 3;
}

message MonitoringStatusChanged {
  MonitoringStatus previous = 1;
  MonitoringStatus current = 2;
}

message FaultDetected {
  // Diagnostic trouble code, for example "BTG_TempCounterStuck".
  string dtc = 1;
  // The requirement that detected the fault, for example "FSR-2.3".
  string requirement = 2;
  // The last fresh sample before the fault was detected, if any.
  SampleRef last_sample = 3;
}

message MitigationRequested {
  Mitigation mitigation = 1;
}

// Identifies a BatteryTemperature message.
message SampleRef {
  uint64 sequence = 1;
  uint64 source_timestamp_ms = 2;
  uint32 alive_counter = 3;
}

enum ThermalState {
  THERMAL_STATE_UNSPECIFIED = 0;
  THERMAL_STATE_CLEAR = 1;
  THERMAL_STATE_MONITORING = 2;
  THERMAL_STATE_WARNING = 3;
  THERMAL_STATE_CRITICAL = 4;
  THERMAL_STATE_MITIGATING = 5;
}

enum MonitoringStatus {
  MONITORING_STATUS_UNSPECIFIED = 0;
  MONITORING_STATUS_OK = 1;
  MONITORING_STATUS_SUSPECT = 2;
  MONITORING_STATUS_DEGRADED = 3;
}

enum Mitigation {
  MITIGATION_UNSPECIFIED = 0;
  MITIGATION_DRIVER_WARNING_OVERTEMP = 1;
  MITIGATION_DRIVER_WARNING_MONITORING_UNAVAILABLE = 2;
}
