# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5)

[package]
name = "thermal-contract"
version = "0.1.0"
description = "uProtocol payloads and topics shared by the VSS Publisher and the Battery Thermal Guardian"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
prost = "0.12"
anyhow = { version = "1", optional = true }
up-rust = { version = "0.9", optional = true }
up-transport-zenoh = { version = "0.9", optional = true }
zenoh = { version = "1", features = ["unstable"], optional = true }

[build-dependencies]
prost-build = "0.12"
protoc-bin-vendored = "3.3.0"

[features]
# uProtocol transport helpers. The VSS Publisher builds without them.
transport = ["dep:anyhow", "dep:up-rust", "dep:up-transport-zenoh", "dep:zenoh"]
