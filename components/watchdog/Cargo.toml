[package]
name = "watchdog"
version = "0.1.0"
description = "Watches the Battery Thermal Guardian's heartbeat; on loss, requests the occupant warning (HARA DFR-5) and reports to DFM (FSR-2.7)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "watchdog"
path = "src/lib.rs"

[[bin]]
name = "watchdog"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
prost = "0.12"
thermal-contract = { version = "0.1.0", path = "../contracts", features = ["transport"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
up-rust = "0.9"

common = { git = "https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/Doctor-Whodunit", rev = "97dd4a503f25674e866a89829e2bd92d2cf2655d" }
fault_lib = { git = "https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/Doctor-Whodunit", rev = "97dd4a503f25674e866a89829e2bd92d2cf2655d" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
