# The transfer helper supplies otaPod from pod.yaml in ankaios-state.yaml.
apiVersion: v1
workloads:
  thermal-stack:
    agent: bench-beta
    runtime: podman-kube
    restartPolicy: ON_FAILURE
    configs:
      pod_manifest: otaPod
    runtimeConfig: |
      playOptions: ["--build=false"]
      manifest: |
        {{> indent content=pod_manifest}}
