name: opendut-can-peer

content:
  repos:
    - id: epel
      baseurl: https://dl.fedoraproject.org/pub/epel/10/Everything/$arch/

  rpms:
    # Remote access and troubleshooting
    - openssh-server
    - openssh-clients
    - dnf
    - curl
    - ca-certificates
    - chrony
    - hostname
    - iproute
    - iputils
    - procps-ng
    - tmux
    - less
    - vim-minimal
    - python3
    # Container workloads
    - podman
    # CAN support and utilities
    - kmod
    - kernel-automotive-modules-extra
    - can-utils

  add_files:
    - path: /etc/modules-load.d/opendut-can.conf
      source_path: files/opendut-can.conf
    - path: /etc/modprobe.d/opendut-can.conf
      source_path: files/opendut-can-options.conf
    - path: /etc/systemd/system/opendut-vcan.service
      source_path: files/opendut-vcan.service

  systemd:
    enabled_services:
      - sshd.service
      - chronyd.service
      - opendut-vcan.service

auth:
  # Development-only sample credentials: root / password.
  root_password: "$6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU."
  sshd_config:
    PasswordAuthentication: true
    PermitRootLogin: true
