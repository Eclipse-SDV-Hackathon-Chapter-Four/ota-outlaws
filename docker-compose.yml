# AI-assisted: Claude Code / Claude Sonnet 5 (claude-sonnet-5)

# =============================================================================
# Doctor Whodunit — KUKSA CAN Provider only
#
# Reduced stack: just the CAN provider and the databroker it writes to.
# No vcan0 or kernel module needed — the provider replays a recorded trace.
#
#   docker compose up
#
# Flow: battery_temp.candump → kuksa-can-provider → kuksa-databroker
# =============================================================================

services:

  kuksa-databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:main
    container_name: kuksa-databroker
    command: ["--insecure"]
    ports:
      - "55555:55555"
    restart: unless-stopped

  kuksa-can-provider:
    image: ghcr.io/eclipse-kuksa/kuksa-can-provider/can-provider:main
    container_name: kuksa-can-provider
    environment:
      KUKSA_ADDRESS: "kuksa-databroker"
      KUKSA_PORT: "55555"
      DBC_FILE: "/can/BMS_MSG1_CAN.dbc"
      MAPPING_FILE: "/can/vss_dbc.json"
      CANDUMP_FILE: "/can/BMS_MSG1_CAN.asc"
    command: ["--dumpfile", "/can/BMS_MSG1_CAN.asc", "--infinite"]
    volumes:
      - ./can:/can:ro
    restart: unless-stopped
    depends_on:
      - kuksa-databroker
