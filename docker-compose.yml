# AI-assisted: Claude Code / Claude Sonnet 5 (claude-sonnet-5); Claude Code / Claude Opus 5 (claude-opus-5); Claude Code / Claude Opus 5.5 (claude-opus-5-5); Codex / GPT-6.1 Sol (gpt-6.1-sol)

# =============================================================================
# Doctor Whodunit — Battery Thermal Guardian signal chain and DFM/OpenSOVD diagnostics
#
# Diagnostics use shared iceoryx2 IPC; see README for the reporting contract.
#
# No vcan0 or kernel module needed — the provider replays a recorded trace
# onto a python-can virtual bus inside its own container.
#
#   docker compose up --build
#   docker compose logs -f guardian
#
# Flow: BMS_MSG1_CAN.asc → kuksa-can-provider → kuksa-databroker
#       → vss-publisher → (uProtocol over the zenoh router) → guardian
#
# can/vss_dbc.json serves two purposes: it is the VSS tree the databroker is
# populated with, and the dbc2vss mapping the provider uses. Keeping it as a
# single source of truth means the mapped signals cannot drift apart from the
# signals the databroker knows.
# =============================================================================

services:

  kuksa-databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:main
    container_name: kuksa-databroker
    command: ["--insecure", "--address", "0.0.0.0", "--vss", "/vss/vss_dbc.json"]
    ports:
      - "${KUKSA_HOST_PORT:-55556}:55555"
    volumes:
      - ./can:/vss:ro
    restart: unless-stopped

  kuksa-can-provider:
    image: ghcr.io/eclipse-kuksa/kuksa-can-provider/can-provider:main
    container_name: kuksa-can-provider
    environment:
      KUKSA_ADDRESS: "kuksa-databroker"
      KUKSA_PORT: "55555"
      DBC_FILE: "/can/BMS_MSG1_CAN.dbc"
      MAPPING_FILE: "/can/vss_dbc.json"
      CANDUMP_FILE: "/can/BMS_MSG1_CAN.asc"
    command: ["--dumpfile", "/can/BMS_MSG1_CAN.asc", "--infinite"]
    volumes:
      - ./can:/can:ro
    restart: unless-stopped
    depends_on:
      - kuksa-databroker

  # Routes uProtocol messages between the VSS Publisher and the Guardian.
  # Same Zenoh version as the Rust services.
  zenoh:
    image: docker.io/eclipse/zenoh:1.10.1
    container_name: zenoh
    # Lets `campaign observe` tap the uProtocol traffic from the host.
    ports:
      - "127.0.0.1:${ZENOH_HOST_PORT:-7447}:7447"
    restart: unless-stopped

  vss-publisher:
    build:
      context: .
      dockerfile: vss-publisher/Containerfile
    image: ota-outlaws/vss-publisher:dev
    container_name: vss-publisher
    environment:
      DATABROKER_ADDR: "http://kuksa-databroker:55555"
      ZENOH_CONNECT: "tcp/zenoh:7447"
      RUST_LOG: "info"
    restart: unless-stopped
    depends_on:
      - kuksa-databroker
      - zenoh

  guardian:
    build:
      context: .
      dockerfile: guardian-service/Containerfile
    image: ota-outlaws/guardian:dev
    container_name: guardian
    tmpfs: [/tmp]
    ipc: "service:opensovd-dfm"
    volumes:
      - ./diagnostics/catalog:/etc/guardian/catalog:ro
    environment:
      ZENOH_CONNECT: "tcp/zenoh:7447"
      SOVD_ENTITY: battery_guardian
      RUST_LOG: "info"
    restart: unless-stopped
    depends_on:
      - zenoh
      - opensovd-dfm

  opensovd-dfm:
    image: ${DIAGNOSTICS_IMAGE:-local/opensovd-demo-fork:verified}
    pull_policy: never
    entrypoint: ["/bin/sh", "/diagnostics-entrypoint.sh", "/usr/local/bin/dfm_bin"]
    command: ["--catalog-dir", "/catalog", "--storage-dir", "/data"]
    tmpfs: [/tmp]
    ipc: shareable
    shm_size: 128mb
    volumes:
      - ./diagnostics/catalog:/catalog:ro
      - dfm-storage:/data
      - ./diagnostics/entrypoint.sh:/diagnostics-entrypoint.sh:ro
    restart: unless-stopped

  opensovd-gateway:
    image: ${DIAGNOSTICS_IMAGE:-local/opensovd-demo-fork:verified}
    pull_policy: never
    entrypoint: ["/bin/sh", "/diagnostics-entrypoint.sh", "/usr/local/bin/opensovd-gateway"]
    command: ["--url", "http://0.0.0.0:7690/sovd", "--dfm-fault-app", "battery_guardian"]
    tmpfs: [/tmp]
    ipc: "service:opensovd-dfm"
    volumes:
      - ./diagnostics/entrypoint.sh:/diagnostics-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${SOVD_PORT:-7690}:7690"
    depends_on:
      opensovd-dfm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7690/sovd/v1/apps/battery_guardian/faults"]
      interval: 5m
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  dfm-storage:
