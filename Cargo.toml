# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5); Codex / GPT-6.1 Sol (gpt-6.1-sol)

[workspace]
resolver = "2"
# One lockfile for every component on the uProtocol bus, so both ends of
# the wire use the same uProtocol and Zenoh versions.
members = [
    "guardian",
    "guardian-service",
    "contracts",
    "vss-publisher",
    "campaign",
    "dashboard",
    "third-party/fault-lib",
]

[workspace.package]
edition = "2021"
license = "EPL-2.0"
rust-version = "1.88"

[patch."https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/Doctor-Whodunit"]
fault_lib = { path = "third-party/fault-lib" }
