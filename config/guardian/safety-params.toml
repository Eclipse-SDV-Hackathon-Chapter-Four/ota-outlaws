# AI-assisted: Claude Code / Claude Opus 5.5 (claude-opus-5-5); Codex / GPT-6.1 Sol (gpt-6.1-sol)

# Safety parameters of the Battery Thermal Guardian.
#
# This file is the single source of truth for the values. The requirements they
# parameterize are traced in docs/reference/hara.md (DFR-x, TS-x). The values
# are proposals until they are tuned with end-to-end measurements.

[thermal]
# θ_warn: WARNING threshold for the maximum cell temperature (FSR-1.1, SG-1).
warn_c = 45.0
# θ_crit: CRITICAL threshold for the maximum cell temperature (FSR-1.2, SG-1).
critical_c = 55.0
# r_trend, T_trend: a valid maximum that rises by at least r_trend on average
# over T_trend raises WARNING even below θ_warn (FSR-1.3, HARA F-7, TS-25).
trend_rise_c_per_s = 1.0
trend_duration_ms = 5000

[freshness]
# T_stale: no fresh sample for longer than this leads to DEGRADED (FSR-2.2,
# FSR-2.3, SG-2).
# Three times the 100 ms signal cycle.
stale_timeout_ms = 300
# A repeated frame has the alive counter of the last fresh sample and a source
# timestamp that is not older, so exact duplicates count too. Repeated frames
# show that the source still sends, so they do not count as an outage (FSR-2.2).
# HARA DFR-7 counts messages with the same counter, including the original:
# 2 messages set SUSPECT, 10 messages set DEGRADED.
# N_suspect: repeated frames since the last fresh sample that set SUSPECT
# (FSR-2.3, HARA DFR-7, TS-07). One duplicate makes two messages.
suspect_repeated_frames = 1
# N_stuck: repeated frames that lead to DEGRADED with a counter stuck fault
# (FSR-2.3, HARA DFR-7, SG-2). Nine repeats make ten messages.
stuck_repeated_frames = 9

[stuck]
# T_stuck: maximum time the maximum may stay frozen while other signals change
# (FSR-2.4, SG-2).
timeout_ms = 3000
# Δ_stuck: minimum change of the average or minimum that makes a frozen maximum
# suspicious (FSR-2.4, SG-2). Two steps of the 1 °C CAN resolution, so that a
# single-step flicker does not count.
min_reference_change_c = 2.0

[plausibility]
# θ_min, θ_max: plausible cell temperature range (FSR-3.2, SG-3, SG-4). The CAN
# signal cannot represent values below 0 °C. θ_max must not be below θ_crit.
min_c = 0.0
max_c = 125.0
# r_max: fastest plausible rise of the maximum, in °C per second (FSR-3.3).
max_rise_c_per_s = 20.0
# Resolution of the CAN temperature signal (1 °C per step). A rise of one step is
# always plausible, even when source timestamps arrive in a burst.
resolution_c = 1.0
# N_suspect, T_suspect for spikes: an isolated rate-implausible sample is
# discarded and sets SUSPECT; this many within this window lead to DEGRADED
# with a rate fault (FSR-3.5, HARA DFR-4, TS-20, TS-21).
suspect_spikes = 3
suspect_window_ms = 1000

[recovery]
# Lower thermal severity only below its threshold minus this hysteresis.
hysteresis_c = 2.0
# Both conditions must hold on consecutive fresh, valid, healthy samples.
# valid_samples alone also brings SUSPECT back to OK (HARA DFR-8).
valid_samples = 10
min_duration_ms = 1000
